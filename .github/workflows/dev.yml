# Trigger the Main update workflow on each push to dev to merge dev into main.

name: Dev

on:
  push:
    branches: ["dev"]

jobs:
  TriggerMainUpdate:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Main update
      # Use the workflow from dev (the source of truth) so that changes to the
      # workflow apply to the merge of the commit introducing them.
      run: gh workflow run "Main update" -R ${{ github.repository }} --ref dev
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
