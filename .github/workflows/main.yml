# Run checks on the piper branch to merge with the main branch.

name: Main update

on:
  workflow_dispatch:

# Queue runs instead of running them in parallel: overlapping runs start from
# the same commit and all but the first one fail to push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  GXUpgrade:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Start from the current tip of main rather than from the commit the run
        # was dispatched on, which is stale for queued runs and re-runs.
        ref: main
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Setup an identity
      run: git config user.email "noreply@github.com" && git config user.name "Github Action"

    - name: Move to the latest version
      run: go get -u github.com/gx-org/gx@main

    - name: Tidy (best effort)
      run: go mod tidy

    - name: Generating code
      run: go generate ./...

    - name: Test after piper merged into main
      run: go test -v ./...

    - name: Commit generated and modified files
      run: |
        if output=$(git status --porcelain) && [ -z "$output" ]; then
          exit 0
        else
          git add .
          git commit -a -m "Auto-commit after Go file generation."
        fi

    - name: Push to main
      # Replay the auto-commit on top of anything pushed to main during the run.
      run: |
        git pull --rebase origin main
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
